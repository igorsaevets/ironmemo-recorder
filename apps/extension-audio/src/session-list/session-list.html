<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IronMemo — Recordings</title>
  <link rel="stylesheet" href="session-list.css">
</head>
<body>
  <header>
    <h1>Recordings</h1>
    <div class="sub">Local recordings in your browser. Files are stored in the extension's OPFS — not in the file system.</div>
  </header>

  <div id="status" class="status" hidden></div>

  <div id="empty" class="empty" hidden>
    <div class="empty-title">No recordings yet</div>
    <div class="empty-hint">Click the extension icon in the Chrome toolbar, then Start recording.</div>
  </div>

  <div id="list"></div>

  <footer>
    <div>Total sessions: <span id="totalCount">0</span> · On disk: <span id="totalSize">0</span></div>
    <button id="refresh" class="btn ghost">Refresh</button>
  </footer>

  <script type="module" src="session-list.js"></script>
</body>
</html>
